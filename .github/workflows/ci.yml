name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  VALKEY_VERSION: "9.1.3"
  HIREDIS_VERSION: "1.5.0"

jobs:
  test:
    name: nginx ${{ matrix.nginx }}${{ matrix.dynamic == '1' && ' (dynamic)' || '' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nginx: "1.30.6", dynamic: "0" }
          - { nginx: "1.31.8", dynamic: "1" }
    env:
      NGINX_VERSION: ${{ matrix.nginx }}
      DYNAMIC: ${{ matrix.dynamic }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -qq -y build-essential libpcre2-dev zlib1g-dev

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            .deps/prefix
            .deps/src/valkey-${{ env.VALKEY_VERSION }}
            .deps/src/hiredis-${{ env.HIREDIS_VERSION }}
          key: deps-${{ runner.os }}-valkey${{ env.VALKEY_VERSION }}-hiredis${{ env.HIREDIS_VERSION }}-${{ hashFiles('script/bootstrap') }}

      - name: Build dependencies and nginx
        run: script/bootstrap

      - name: Load as a dynamic module
        if: matrix.dynamic == '1'
        run: echo "BOT_VERIFIER_MODULE=$PWD/.deps/nginx/modules/ngx_http_bot_verifier_module.so" >> "$GITHUB_ENV"

      - name: Test
        run: cd tests && uv run pytest -v

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.nginx }}-${{ matrix.dynamic }}
          path: /tmp/pytest-of-*/
          retention-days: 7

  sanitize:
    name: ASan / UBSan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -qq -y build-essential libpcre2-dev zlib1g-dev
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Test with sanitizers
        run: make sanitize
