# docker compose -f examples/docker-compose.yml up --build    (or: make docker-up)
#
# nginx on http://localhost:8081, metrics on http://localhost:8081/metrics.
#   curl -A "Mozilla/5.0 (compatible; Googlebot/2.1)" -i localhost:8081/   -> 403
name: ngx-bot-verifier

services:
  valkey:
    image: valkey/valkey:9.1.3

  nginx:
    build:
      context: ..
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # http-level settings; the 00- prefix makes them load before default.conf
      - ./bot_verifier.conf:/etc/nginx/conf.d/00-bot_verifier.conf:ro
    depends_on:
      - valkey
