# docker compose -f examples/docker-compose.yml up --build
#
# nginx on http://localhost:8080, metrics on http://localhost:8080/metrics,
# admin UI on http://localhost:8090 (no login; published on loopback only),
# Grafana on http://localhost:3000 (Repsheet dashboard; admin/admin to edit),
# Prometheus on http://localhost:9090.
# A passive detector blocks addresses that get 50 error responses in a minute
# (for 5 minutes): nginx logs every request to a shared volume, the collector
# follows the log and forwards it to the status-codes analyzer.
# Manage decisions with:
#   docker compose -f examples/docker-compose.yml exec valkey valkey-cli REPSHEET.BLOCK 172.16.0.0/12 REASON demo
name: repsheet

services:
  valkey:
    build:
      context: ..
      target: valkey

  nginx:
    build:
      context: ..
      target: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # http-level settings; the 00- prefix makes them load before default.conf
      - ./repsheet.conf:/etc/nginx/conf.d/00-repsheet.conf:ro
      - events:/var/log/repsheet
    depends_on:
      - valkey

  admin:
    build:
      context: ..
      target: admin
    environment:
      REPSHEET_REDIS: redis://valkey:6379
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - valkey

  # Passive detector: nginx's event log -> collector -> status-codes -> Valkey.
  collector:
    build:
      context: ..
      target: collector
    environment:
      REPSHEET_COLLECTOR_FILE: /var/log/repsheet/events.log
      REPSHEET_COLLECTOR_FORWARD: status-codes:7400
    volumes:
      - events:/var/log/repsheet:ro
    depends_on:
      - nginx
      - status-codes

  status-codes:
    build:
      context: ..
      target: status-codes
    environment:
      REPSHEET_REDIS: redis://valkey:6379
      REPSHEET_STATUS_CODES_THRESHOLD: "50"
      REPSHEET_STATUS_CODES_WINDOW: 60s
      REPSHEET_STATUS_CODES_STATUSES: 400-599
      REPSHEET_STATUS_CODES_TTL: 5m
    depends_on:
      - valkey

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - nginx

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      # Local demo: anyone on this machine can view; sign in as admin/admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/repsheet.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  events:
  prometheus:
  grafana:
