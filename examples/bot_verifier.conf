# http-level settings (included inside http {} by the stock nginx.conf).

# Reverse and forward lookups go through nginx's own asynchronous resolver.
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

bot_verifier on;

# Published ranges verify most Google, Bing, Apple and DuckDuckGo crawlers
# without any DNS query (fetched when the image was built; see fetch-ranges).
bot_verifier_ranges google     /etc/nginx/bot_ranges/google-common-crawlers.json
                               /etc/nginx/bot_ranges/google-special-crawlers.json
                               /etc/nginx/bot_ranges/google-user-triggered-fetchers.json
                               /etc/nginx/bot_ranges/google-user-triggered-fetchers-google.json;
bot_verifier_ranges bing       /etc/nginx/bot_ranges/bingbot.json;
bot_verifier_ranges apple      /etc/nginx/bot_ranges/applebot.json;
bot_verifier_ranges duckduckgo /etc/nginx/bot_ranges/duckduckbot.json;

# Share results between nginx servers.
bot_verifier_redis valkey:6379;

log_format bot_verifier '$remote_addr "$request" $status "$http_user_agent" '
                        'bot=$bot_verifier_result provider=$bot_verifier_provider';
