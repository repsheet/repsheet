# http-level Repsheet settings (included inside http {} by the stock nginx.conf).
repsheet_redis valkey:6379;
repsheet on;

# Active detector: verify clients that claim to be search engine crawlers and
# block the ones that are not (try: curl -A Googlebot localhost:8080/).
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
repsheet_bot_verifier on;
repsheet_bot_verifier_ranges google     /etc/nginx/bot_ranges/google-common-crawlers.json
                                        /etc/nginx/bot_ranges/google-special-crawlers.json
                                        /etc/nginx/bot_ranges/google-user-triggered-fetchers.json
                                        /etc/nginx/bot_ranges/google-user-triggered-fetchers-google.json;
repsheet_bot_verifier_ranges bing       /etc/nginx/bot_ranges/bingbot.json;
repsheet_bot_verifier_ranges apple      /etc/nginx/bot_ranges/applebot.json;
repsheet_bot_verifier_ranges duckduckgo /etc/nginx/bot_ranges/duckduckbot.json;

# Also check a session cookie and an API key header.
repsheet_actor session $cookie_session;
repsheet_actor api_key $http_x_api_key;

# Tell the application about marked actors without blocking them.
map $repsheet_status $repsheet_mark_reason {
    mark    $repsheet_reason;
    default "";
}

# Rate limit marked actors harder than everyone else.
map $repsheet_status $repsheet_limit_key {
    mark    $binary_remote_addr;
    default "";
}
limit_req_zone $repsheet_limit_key zone=marked:10m rate=2r/s;

log_format repsheet '$remote_addr "$request" $status repsheet=$repsheet_status '
                    'actor="$repsheet_actor" reason="$repsheet_reason" '
                    'bot=$repsheet_bot_verifier_result/$repsheet_bot_verifier_provider';
