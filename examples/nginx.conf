server {
    listen 80;
    access_log /var/log/nginx/access.log repsheet;

    # Behind a load balancer, trust it for the client address:
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    location / {
        limit_req zone=marked burst=5 nodelay;
        root /usr/share/nginx/html;
        # With proxy_pass, forward the mark to the application:
        # proxy_set_header X-Repsheet $repsheet_mark_reason;
    }

    location = /metrics {
        repsheet off;
        repsheet_metrics;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}
