server {
    listen 80;
    access_log /var/log/nginx/access.log bot_verifier;

    # Behind a load balancer, trust it for the client address:
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    location / {
        root /usr/share/nginx/html;
        # Tell the application which crawler it is talking to:
        # proxy_set_header X-Verified-Crawler $bot_verifier_provider;
    }

    location = /metrics {
        bot_verifier off;
        bot_verifier_metrics;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}
