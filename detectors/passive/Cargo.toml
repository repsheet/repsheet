# Passive detectors: programs that read traffic outside the request path and
# write Repsheet decisions. See README.md.
[workspace]
resolver = "3"
members = ["event", "collector", "status-codes"]

[workspace.package]
version = "6.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
