[package]
name = "repsheet-bench"
version = "6.0.0"
description = "Benchmark for the Repsheet nginx module's request-path overhead"
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version = "1.88"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hdrhistogram = "7.6.0"
libc = "0.2.191"
redis = { version = "1.8.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }

[profile.release]
lto = "thin"
debug = 1
