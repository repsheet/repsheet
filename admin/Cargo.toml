[package]
name = "repsheet-admin"
version = "6.0.0"
edition = "2024"
rust-version = "1.88"
description = "Web administration UI for Repsheet"
license = "Apache-2.0"
publish = false

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
cc = "1.11.2"

[profile.release]
lto = "thin"
strip = true
